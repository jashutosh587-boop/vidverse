# NOTE: not run in the environment where the project was written (no Docker there). Treat it as a starting point.
#
#   cp .env.example .env     # fill it in; DATABASE_URL below is already set for the db service
#   docker compose up -d --build
#
# Put a reverse proxy with HTTPS in front (see docs/DEPLOYMENT.md). Port 3000 is bound to the host's loopback only.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vidverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vidverse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vidverse:${POSTGRES_PASSWORD}@db:5432/vidverse
      DATABASE_SSL: "false"   # the database is on the private compose network
      WORKER: separate
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - media:/data

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vidverse:${POSTGRES_PASSWORD}@db:5432/vidverse
      DATABASE_SSL: "false"
    command: ["node", "src/worker.js"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data

volumes:
  pgdata:
  media:
